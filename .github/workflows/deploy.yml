name: Deploy

# Runs after CI passes on main (or manually from the Actions tab).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  # Single Docker Hub repo; backend/frontend are distinguished by tag prefix.
  IMAGE_REPO: kevinzheng123/msa-phase2
  # Azure Container Apps names (from the live URLs in README).
  BACKEND_APP: msa-backend
  FRONTEND_APP: msa-frontend
  AZURE_RESOURCE_GROUP: msa-phase2
  # Baked into the frontend bundle at build time.
  VITE_API_URL: https://msa-backend.icyglacier-3b078f70.australiaeast.azurecontainerapps.io

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute image tag
        run: echo "TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: software/backend
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:backend-${{ env.TAG }}
            ${{ env.IMAGE_REPO }}:backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: software/frontend
          push: true
          build-args: VITE_API_URL=${{ env.VITE_API_URL }}
          tags: |
            ${{ env.IMAGE_REPO }}:frontend-${{ env.TAG }}
            ${{ env.IMAGE_REPO }}:frontend

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # A unique tag per commit forces Container Apps to roll out a new revision.
      - name: Deploy backend
        run: >
          az containerapp update
          --name "$BACKEND_APP"
          --resource-group "$AZURE_RESOURCE_GROUP"
          --image "$IMAGE_REPO:backend-$TAG"

      - name: Deploy frontend
        run: >
          az containerapp update
          --name "$FRONTEND_APP"
          --resource-group "$AZURE_RESOURCE_GROUP"
          --image "$IMAGE_REPO:frontend-$TAG"
